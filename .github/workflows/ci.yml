
name: Vendor Fraud - CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    name: Spring Boot Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'Vendor Backend/backend/pom.xml'

      - name: Build Spring Boot Backend
        working-directory: 'Vendor Backend/backend'
        run: mvn -B -DskipTests clean package

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: vendor-fraud-backend
          path: 'Vendor Backend/backend/target/*.jar'
          if-no-files-found: error
          retention-days: 7

  frontend-build:
    name: React Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'Vendor Frontend/frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: 'Vendor Frontend/frontend'
        run: npm ci

      - name: Build React Frontend
        working-directory: 'Vendor Frontend/frontend'
        run: npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: vendor-fraud-frontend
          path: 'Vendor Frontend/frontend/dist/'
          if-no-files-found: error
          retention-days: 7

  docker-publish:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - frontend-build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: './Vendor Backend/backend'
          file: './Vendor Backend/backend/Dockerfile'
          push: true
          tags: |
            ghcr.io/saimeghana08/vendor-fraud-backend:latest
            ghcr.io/saimeghana08/vendor-fraud-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: './Vendor Frontend/frontend'
          file: './Vendor Frontend/frontend/Dockerfile'
          push: true
          tags: |
            ghcr.io/saimeghana08/vendor-fraud-frontend:latest
            ghcr.io/saimeghana08/vendor-fraud-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
