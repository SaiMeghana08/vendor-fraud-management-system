
name: Vendor Fraud - CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # ========================================
  # JOB 1: SPRING BOOT BACKEND
  # ========================================

  backend-build:
    name: Spring Boot Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'Vendor Backend/backend/pom.xml'

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build Spring Boot Backend
        working-directory: 'Vendor Backend/backend'
        run: mvn -B -DskipTests clean package

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: vendor-fraud-backend
          path: 'Vendor Backend/backend/target/*.jar'
          if-no-files-found: error
          retention-days: 7

  # ========================================
  # JOB 2: REACT FRONTEND
  # ========================================

  frontend-build:
    name: React Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'Vendor Frontend/frontend/package-lock.json'

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      - name: Install Frontend Dependencies
        working-directory: 'Vendor Frontend/frontend'
        run: npm ci

      - name: Build React Frontend
        working-directory: 'Vendor Frontend/frontend'
        run: npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: vendor-fraud-frontend
          path: |
            Vendor Frontend/frontend/dist/
            Vendor Frontend/frontend/build/
          if-no-files-found: error
          retention-days: 7

  # ========================================
  # JOB 3: DOCKER BUILD AND PUSH TO GHCR
  # ========================================

  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - frontend-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: './Vendor Backend/backend'
          file: './Vendor Backend/backend/Dockerfile'
          push: true
          tags: |
            ghcr.io/saimeghana08/vendor-fraud-backend:latest
            ghcr.io/saimeghana08/vendor-fraud-backend:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: './Vendor Frontend/frontend'
          file: './Vendor Frontend/frontend/Dockerfile'
          push: true
          tags: |
            ghcr.io/saimeghana08/vendor-fraud-frontend:latest
            ghcr.io/saimeghana08/vendor-fraud-frontend:${{ github.sha }}
