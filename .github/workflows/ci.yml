
name: Vendor Fraud - CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-fraud-production
  cancel-in-progress: false

jobs:
  backend-build:
    name: Spring Boot Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'Vendor Backend/backend/pom.xml'

      - name: Build and Test Spring Boot Backend
        working-directory: 'Vendor Backend/backend'
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: vendor-fraud-backend
          path: 'Vendor Backend/backend/target/*.jar'
          if-no-files-found: error
          retention-days: 7

  frontend-build:
    name: React Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'Vendor Frontend/frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: 'Vendor Frontend/frontend'
        run: npm ci

      - name: Build React Frontend
        working-directory: 'Vendor Frontend/frontend'
        run: npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: vendor-fraud-frontend
          path: 'Vendor Frontend/frontend/dist/'
          if-no-files-found: error
          retention-days: 7

  docker-publish:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - frontend-build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: './Vendor Backend/backend'
          file: './Vendor Backend/backend/Dockerfile'
          push: true
          tags: |
            ghcr.io/saimeghana08/vendor-fraud-backend:latest
            ghcr.io/saimeghana08/vendor-fraud-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: './Vendor Frontend/frontend'
          file: './Vendor Frontend/frontend/Dockerfile'
          push: true
          tags: |
            ghcr.io/saimeghana08/vendor-fraud-frontend:latest
            ghcr.io/saimeghana08/vendor-fraud-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - docker-publish

    environment: production

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/vendor_deploy
          chmod 600 ~/.ssh/vendor_deploy

          printf '%s\n' "$EC2_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "Testing EC2 SSH connection..."

          ssh -i ~/.ssh/vendor_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful'"

      - name: Deploy Docker Images to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/vendor_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -se" <<'REMOTE'
          set -euo pipefail

          cd ~/vendor-fraud-deployment

          echo "Checking deployment files..."
          test -f docker-compose.yaml
          test -f .env

          echo "Checking passwordless sudo access..."
          sudo -n true

          export BACKEND_IMAGE_TAG="$IMAGE_TAG"
          export FRONTEND_IMAGE_TAG="$IMAGE_TAG"

          echo "Validating Docker Compose..."
          sudo -n docker compose --env-file .env config --quiet

          echo "Images selected for deployment:"
          sudo -n docker compose --env-file .env config --images

          echo "Pulling backend and frontend images..."
          sudo -n docker compose --env-file .env pull backend frontend

          echo "Starting updated containers..."
          sudo -n docker compose --env-file .env up -d \
            --no-deps backend frontend

          echo "Checking container status..."
          sudo -n docker compose --env-file .env ps

          echo "Checking frontend availability..."

          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null \
              http://127.0.0.1:8085/; then
              echo "Frontend is responding."
              exit 0
            fi

            echo "Waiting for frontend... attempt $attempt/30"
            sleep 5
          done

          echo "Frontend health check failed."

          sudo -n docker compose --env-file .env ps

          sudo -n docker compose --env-file .env logs \
            --tail=100 frontend backend

          exit 1
          REMOTE

      - name: Deployment Summary
        if: success()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Deployment completed."
          echo "Commit: ${{ github.sha }}"
          echo "Backend and frontend images deployed to EC2."
          echo "Application URL: http://$EC2_HOST/"
