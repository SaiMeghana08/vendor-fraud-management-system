
name: Vendor Fraud - CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    name: Spring Boot Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'Vendor Backend/backend/pom.xml'

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build Spring Boot Backend
        working-directory: 'Vendor Backend/backend'
        run: mvn -B -DskipTests clean package

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: vendor-fraud-backend
          path: 'Vendor Backend/backend/target/*.jar'
          if-no-files-found: error
          retention-days: 7
